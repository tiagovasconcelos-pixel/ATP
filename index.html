<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aporte ATP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: um cartao central, telefone primeiro — o link e aberto no WhatsApp, em pe. */
:root{
  --ground:#e7eaef;
  --card:#ffffff;
  --ink:#14171a;
  --muted:#858d99;
  --line:#e4e7ee;
  --field:#f4f6fa;
  --accent:#2b63e3;
  --alerta:#b42318;
  --on-accent:#ffffff;
  --accent-ink:#1d4ed8;
  --accent-soft:#eef3fe;
  --accent-line:#b9cefa;
  --shadow:0 18px 50px -24px rgba(18,28,58,.32);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Peca institucional: tema claro fixo, para os tres verem a mesma pagina
     independente do aparelho. Por isso nao ha bloco de modo escuro. */
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font);
  margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px;
  display:flex;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--card);
  width:100%;
  max-width:520px;
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:46px 24px 24px;
  display:flex;
  flex-direction:column;
  gap:26px;
}
.monthrow{display:flex;align-items:center;gap:8px;margin-top:6px}
h1{
  font-size:clamp(25px,6.4vw,31px);
  line-height:1.12;
  font-weight:800;
  letter-spacing:-.025em;
  margin:0;
  color:var(--accent-ink);
  text-wrap:balance;
}
.month{
  flex:1;min-width:0;
  font-size:17px;font-weight:700;letter-spacing:-.01em;
}
.sub{margin:5px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.step{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  width:28px;height:28px;
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  flex:none;
  display:grid;place-items:center;
  transition:border-color .15s,color .15s;
}
.step:hover{border-color:var(--accent-line);color:var(--ink)}
.step:disabled{opacity:.3;cursor:default}
.label{
  font-size:12.5px;font-weight:600;color:var(--muted);
  margin-bottom:10px;display:block;
}
.sub.ok{color:var(--accent-ink);font-weight:600}
.sub.late{color:var(--ink);font-weight:600}
.pixbox{
  background:var(--field);border-radius:18px;
  padding:14px 14px 14px 16px;
  display:flex;align-items:center;gap:12px;
}
.pixkey{flex:1;min-width:0}
.pixcap{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pixkey strong{display:block;font-size:15px;font-weight:700;line-height:1.3;word-break:break-all}
.pixkey strong.empty{color:var(--muted);font-weight:500;font-style:italic}
.copy{
  flex:none;border:1.5px solid var(--accent-line);background:var(--card);
  color:var(--accent-ink);font-family:var(--font);font-size:13px;font-weight:700;
  border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;
}
.copy:hover{border-color:var(--accent)}
.bankmeta{margin:12px 2px 0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;align-items:baseline}
.bankmeta dt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.bankmeta dd{margin:0;font-size:13px;font-weight:600;word-break:break-word}
.bankmeta dd.empty{color:var(--muted);font-weight:500}
.pills{display:flex;flex-direction:column;gap:10px}
.pill{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:999px;
  padding:12px 18px 12px 14px;
  font-family:var(--font);
  font-size:15px;font-weight:600;
  cursor:pointer;
  transition:border-color .15s,background .15s;
}
.pill:hover{border-color:var(--accent-line)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pill.done{border-color:var(--accent-line);background:var(--accent-soft)}
.pill:disabled{cursor:default}
.pill:disabled:hover{border-color:var(--line)}
.pill.done:disabled:hover{border-color:var(--accent-line)}
.mark{
  flex:none;width:24px;height:24px;border-radius:999px;
  border:1.5px solid var(--line);
  display:grid;place-items:center;
  font-size:13px;font-weight:800;color:transparent;
  transition:background .15s,border-color .15s,color .15s;
}
.pill.done .mark,.pill[aria-pressed="true"] .mark{
  background:var(--accent);border-color:var(--accent);color:var(--on-accent);
}
.who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.pill.done .amt{color:var(--accent-ink)}
.when{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
button.cta{
  width:100%;
  border:0;border-radius:999px;
  background:var(--accent);
  color:var(--on-accent);
  font-family:var(--font);
  font-size:16px;font-weight:700;
  padding:16px;
  cursor:pointer;
  transition:filter .15s;
}
button.cta:hover{filter:brightness(.95)}
button.cta:disabled{background:var(--field);color:var(--muted);cursor:default;filter:none}
.tally{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-top:1px solid var(--line);padding-top:16px;
}
.tally .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tally .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.sign{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em;margin:2px 0 0}
.edit{
  background:none;border:0;padding:0;
  font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--accent-ink);cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.row .label{margin:0}
input.f{
  width:100%;font-family:var(--font);font-size:14.5px;font-weight:600;
  color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;
}
input.f::placeholder{color:var(--muted);font-weight:500}
input.f:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.pill:focus-visible,button.cta:focus-visible,.step:focus-visible,.edit:focus-visible{
  outline:2px solid var(--accent-ink);outline-offset:2px;
}
.mini{display:flex;gap:8px;margin-top:4px}
.mini button{
  flex:1;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);
  font-family:var(--font);font-size:14px;font-weight:600;
  padding:11px;cursor:pointer;
}
.mini button.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vrow span{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow input.f{width:128px;flex:none;margin-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>


<div class="card">
  <div>
    <h1>ATP Investimentos</h1>
    <div class="monthrow">
      <span class="month" id="monthTitle">—</span>
      <button class="step" id="prev" type="button" aria-label="Mês anterior">&#8249;</button>
      <button class="step" id="next" type="button" aria-label="Próximo mês">&#8250;</button>
    </div>
    <p class="sub" id="sub">&nbsp;</p>
  </div>

  <section>
    <div class="row">
      <span class="label">Para depositar</span>
      <button class="edit" id="editBank" type="button" hidden>editar</button>
    </div>
    <div id="bankView">
      <div class="pixbox">
        <div class="pixkey">
          <span class="pixcap">Chave PIX CNPJ</span>
          <strong id="bPix" class="empty">a preencher</strong>
        </div>
        <button class="copy" id="copyPix" type="button" hidden>Copiar</button>
      </div>
      <dl class="bankmeta">
        <dt>Banco</dt><dd id="bBanco" class="empty">—</dd>
      </dl>
    </div>
    <div id="bankEdit" hidden>
      <input class="f" id="iPix" placeholder="Chave PIX" autocomplete="off">
      <input class="f" id="iBanco" placeholder="Banco, agência e conta" autocomplete="off">
      <input class="f" id="iDia" placeholder="Dia do vencimento, ex: 10" inputmode="numeric" autocomplete="off">
      <span class="label" style="margin-top:16px">Valor mensal de cada um</span>
      <div id="valores"></div>
      <div class="mini">
        <button type="button" id="bankCancel">Cancelar</button>
        <button type="button" class="ok" id="bankSave">Salvar</button>
      </div>
    </div>
  </section>

  <section>
    <span class="label">Quem já depositou</span>
    <div class="pills" id="pills"></div>
  </section>

  <div>
    <button class="cta" id="cta" type="button" disabled>Carregando…</button>
    <p class="note" id="hint" style="margin-top:12px"></p>
    <p id="erro" hidden style="margin-top:10px;color:var(--alerta);font-size:13px;line-height:1.45;font-weight:600;word-break:break-word"></p>
  </div>

  <div class="tally">
    <span class="k">Entrou no mês</span>
    <span class="v" id="total">—</span>
  </div>

  <p class="sign">Criado por Silvana.</p>
</div>


<script>
(function(){
  "use strict";
  var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho",
             "agosto","setembro","outubro","novembro","dezembro"];

  function hojeRecife(){
    var p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Recife",
      year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var o={};p.forEach(function(x){o[x.type]=x.value;});
    return {y:+o.year,m:+o.month};
  }
  function chave(y,m){return y+"-"+(m<10?"0":"")+m;}
  function rotulo(y,m){var s=MESES[m-1];return s.charAt(0).toUpperCase()+s.slice(1)+" "+y;}
  function brl(n){
    if(typeof n!=="number"||!isFinite(n))return null;
    return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",
      minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function parseValor(s){
    if(!s)return null;
    var t=String(s).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");
    var n=parseFloat(t);return isFinite(n)&&n>0?n:null;
  }
  function dia2(iso){
    try{return new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Recife",
      day:"2-digit",month:"2-digit"}).format(new Date(iso));}catch(e){return "";}
  }

  var hoje=hojeRecife(), vy=hoje.y, vm=hoje.m;
  var st={cfg:{membros:[],pix:"",banco:"",dia:10}, dep:{}, escolhido:null, ocupado:false, erro:null};
  var $=function(id){return document.getElementById(id);};
  var atual=function(){return vy===hoje.y&&vm===hoje.m;};

  function pinta(){
    $("monthTitle").textContent=rotulo(vy,vm);
    $("next").disabled=(vy>hoje.y)||(vy===hoje.y&&vm>=hoje.m);
    $("sub").textContent=st.cfg.dia?("Vencimento dia "+st.cfg.dia):"\u00a0";

    var c=st.cfg, pix=$("bPix");
    if(c.pix){pix.textContent=c.pix;pix.classList.remove("empty");}
    else{pix.textContent="a preencher";pix.classList.add("empty");}
    $("copyPix").hidden=!c.pix;
    var bb=$("bBanco");
    if(c.banco){bb.textContent=c.banco;bb.classList.remove("empty");}
    else{bb.textContent="\u2014";bb.classList.add("empty");}

    var box=$("pills"); box.textContent="";
    (c.membros||[]).forEach(function(m){
      var rec=st.dep[m.id], feito=!!rec;
      var b=document.createElement("button");
      b.type="button";
      b.className="pill"+(feito?" done":"");
      b.setAttribute("aria-pressed",st.escolhido===m.id?"true":"false");
      b.disabled=st.ocupado;
      var mk=document.createElement("span");mk.className="mark";mk.textContent="\u2713";b.appendChild(mk);
      var who=document.createElement("span");who.className="who";who.textContent=m.nome;
      if(feito&&rec.at){
        var w=document.createElement("span");w.className="when";
        w.textContent="confirmado em "+dia2(rec.at);who.appendChild(w);
      }
      b.appendChild(who);
      var a=document.createElement("span");a.className="amt";
      var v=(rec&&typeof rec.valor==="number")?rec.valor:m.valor;
      a.textContent=brl(v)||"\u2014";b.appendChild(a);
      b.addEventListener("click",function(){
        st.escolhido=(st.escolhido===m.id)?null:m.id; pinta();
      });
      box.appendChild(b);
    });

    var cta=$("cta"), dica=$("hint"), membros=st.cfg.membros||[];
    var semValor=membros.some(function(x){return typeof x.valor!=="number";});
    if(!membros.length||semValor){
      cta.disabled=true;cta.textContent="Preencha a conta e os valores";
      dica.textContent="Toque em editar para colocar o PIX e o valor de cada um.";
    }else if(!st.escolhido){
      cta.disabled=true;cta.textContent="Toque no seu nome";
      dica.textContent="Escolha o seu nome na lista e confirme o depósito.";
    }else{
      var m=membros.filter(function(x){return x.id===st.escolhido;})[0];
      var feito=!!st.dep[st.escolhido];
      cta.disabled=st.ocupado;
      cta.textContent=st.ocupado?"Gravando…":(feito?("Desfazer \u2014 "+m.nome):("Confirmar depósito de "+m.nome));
      dica.textContent=feito?"Já está marcado. Desfaça só se foi engano."
                            :("Isso marca o depósito de "+m.nome+" em "+rotulo(vy,vm).toLowerCase()+".");
    }

    var n=0,soma=0,tem=false;
    membros.forEach(function(m){
      var r=st.dep[m.id]; if(!r)return; n++;
      var v=(typeof r.valor==="number")?r.valor:m.valor;
      if(typeof v==="number"){soma+=v;tem=true;}
    });
    $("total").textContent = tem ? (brl(soma)+"  \u00b7  "+n+" de "+membros.length)
                                 : (n+" de "+membros.length);

    var er=$("erro");
    if(st.erro){ er.hidden=false; er.textContent=st.erro; }
    else { er.hidden=true; er.textContent=""; }
  }

  function lerResposta(etapa){
    return function(r){
      if(r.ok) return r.json();
      return r.text().then(function(t){
        var msg="";
        try{ var j=JSON.parse(t); msg=[j.erro,j.comoResolver].filter(Boolean).join(" \u2014 "); }
        catch(e){ msg=String(t||"").slice(0,240); }
        throw new Error(etapa+" (HTTP "+r.status+")"+(msg?": "+msg:""));
      });
    };
  }

  function falhou(etapa){
    return function(e){
      var m=(e&&e.message)?String(e.message):"";
      if(!m||/failed to fetch|load failed|networkerror|network request failed/i.test(m)){
        m=etapa+": a página não conseguiu falar com o servidor (rede caiu ou a função está fora do ar).";
      }
      st.erro=m;
      pinta();
    };
  }

  function carregar(){
    st.erro=null;
    return fetch("/api/estado?mes="+chave(vy,vm))
      .then(lerResposta("não consegui carregar"))
      .then(function(d){
        st.cfg=d.config||st.cfg;
        st.dep=d.deposito||{};
        if(d.gravando===false){
          st.erro="Esta página está só de leitura: o banco de dados não está ligado, então nada que você marcar vai ser gravado."
            +(d.detalhe?(" O banco respondeu: "+d.detalhe):"")
            +(d.variaveisEncontradas?(" Variáveis vistas: "+(d.variaveisEncontradas.join(", ")||"nenhuma")+".")
                                    :" Nenhuma variável de banco encontrada.");
        }
        pinta();
      })
      .catch(falhou("não consegui carregar"));
  }

  $("prev").addEventListener("click",function(){
    var m=vm-1,y=vy; if(m<1){m=12;y--;}
    vy=y;vm=m;st.escolhido=null;st.erro=null;pinta();carregar();
  });
  $("next").addEventListener("click",function(){
    var m=vm+1,y=vy; if(m>12){m=1;y++;}
    if(y>hoje.y||(y===hoje.y&&m>hoje.m))return;
    vy=y;vm=m;st.escolhido=null;st.erro=null;pinta();carregar();
  });

  $("cta").addEventListener("click",function(){
    if(!st.escolhido||st.ocupado)return;
    st.ocupado=true;st.erro=null;pinta();
    fetch("/api/marcar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mes:chave(vy,vm), id:st.escolhido})})
      .then(lerResposta("não consegui gravar"))
      .then(function(d){ st.dep=d.deposito||{}; st.escolhido=null; })
      .catch(falhou("não consegui gravar"))
      .then(function(){ st.ocupado=false; pinta(); });
  });

  $("copyPix").addEventListener("click",function(){
    var k=st.cfg.pix; if(!k)return;
    var btn=this;
    function pisca(t){btn.textContent=t;setTimeout(function(){btn.textContent="Copiar";},1800);}
    function selecionar(){
      try{
        var r=document.createRange();r.selectNodeContents($("bPix"));
        var s=window.getSelection();s.removeAllRanges();s.addRange(r);pisca("Selecionado");
      }catch(e){pisca("Copie à mão");}
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(k).then(function(){pisca("Copiado");},selecionar);
      else selecionar();
    }catch(e){selecionar();}
  });

  // edicao da conta e dos valores
  $("editBank").hidden=false;
  $("editBank").addEventListener("click",function(){
    var c=st.cfg;
    $("iPix").value=c.pix||"";$("iBanco").value=c.banco||"";
    $("iDia").value=c.dia?String(c.dia):"";
    var box=$("valores");box.textContent="";
    (c.membros||[]).forEach(function(m){
      var row=document.createElement("div");row.className="vrow";
      var nm=document.createElement("span");nm.textContent=m.nome;
      var inp=document.createElement("input");
      inp.className="f";inp.id="v_"+m.id;inp.inputMode="decimal";inp.autocomplete="off";
      inp.placeholder="ex: 300";
      inp.value=(typeof m.valor==="number")?String(m.valor).replace(".",","):"";
      row.appendChild(nm);row.appendChild(inp);box.appendChild(row);
    });
    $("bankView").hidden=true;$("bankEdit").hidden=false;$("editBank").hidden=true;
    $("iPix").focus();
  });
  $("bankCancel").addEventListener("click",function(){
    $("bankView").hidden=false;$("bankEdit").hidden=true;$("editBank").hidden=false;
  });
  $("bankSave").addEventListener("click",function(){
    var btn=this;btn.disabled=true;
    var cfg={
      membros:(st.cfg.membros||[]).map(function(m){
        var el=$("v_"+m.id);
        return {id:m.id,nome:m.nome,valor:el?parseValor(el.value):(m.valor==null?null:m.valor)};
      }),
      pix:$("iPix").value.trim(),
      banco:$("iBanco").value.trim(),
      dia:(function(){var d=parseInt($("iDia").value,10);return (d>=1&&d<=28)?d:(st.cfg.dia||10);})()
    };
    fetch("/api/marcar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({config:cfg})})
      .then(lerResposta("não consegui salvar a conta"))
      .then(function(d){
        st.cfg=d.config||cfg;
        $("bankView").hidden=false;$("bankEdit").hidden=true;$("editBank").hidden=false;
        pinta();
      })
      .catch(falhou("não consegui salvar a conta"))
      .then(function(){ btn.disabled=false; });
  });

  pinta();
  carregar();
})();
</script>

</body></html>
